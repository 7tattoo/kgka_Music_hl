name: Build Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 需要写权限才能创建 GitHub Release
permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Auto-increment version from tag
        shell: bash
        run: |
          # 从 tag (v2.6.1) 提取版本号，build 号用日期+序号保证每次递增
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ -z "$TAG_VERSION" || "$TAG_VERSION" == "$GITHUB_REF_NAME" ]]; then
            # workflow_dispatch 或非 v 前缀，用当前 pubspec 版本
            TAG_VERSION=$(grep -oP '^version: \K[^+]+' pubspec.yaml | head -1)
          fi
          BUILD_DATE=$(date +%Y%m%d)
          # 递增 build 号：日期 + 短 SHA 前2位，保证唯一递增
          BUILD_NO="${BUILD_DATE}${GITHUB_SHA:0:2}"
          NEW_VERSION="${TAG_VERSION}+${BUILD_NO}"
          sed -i "s/^version: .*/version: ${NEW_VERSION}/" pubspec.yaml
          echo "Set version: ${NEW_VERSION}"

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk kgka_Music_Android-${{ github.ref_name }}.apk

      - name: Rename App Bundle
        run: |
          cp build/app/outputs/bundle/release/app-release.aab kgka_Music_Android-${{ github.ref_name }}.aab

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            kgka_Music_Android-*.apk
            kgka_Music_Android-*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kgka_Music-Android-APK
          path: kgka_Music_Android-*.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kgka_Music-Android-AAB
          path: kgka_Music_Android-*.aab
          retention-days: 30
