name: Build Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - com.tencent.ibg.joox
          - com.spotify.music
          - com.apple.android.music
          - com.luna.music.car
          - com.kugou.android.auto
          - cn.kuwo.kwmusiccar
          - com.qidian.QDReader
          - com.tencent.weread
          - cn.aqzscn.stream_music
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify image assets are real binaries (not LFS pointers)
        shell: bash
        run: |
          bad=0
          while IFS= read -r f; do
            if head -c 45 "$f" | grep -q 'git-lfs.github.com/spec'; then
              echo "::error file=$f::still a git-lfs pointer, not real image data"
              bad=1
            fi
          done < <(find . -path ./.git -prune -o -type f \
                     \( -name '*.png' -o -name '*.jpg' -o -name '*.ico' \) -print)
          if [ "$bad" != "0" ]; then
            exit 1
          fi
          echo "all image assets are real binaries"

      - name: Install dependencies
        run: flutter pub get

      - name: Auto-increment version from tag
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ -z "$TAG_VERSION" || "$TAG_VERSION" == "$GITHUB_REF_NAME" ]]; then
            TAG_VERSION=$(grep -oP '^version: \K[^+]+' pubspec.yaml | head -1)
          fi
          BUILD_DATE=$(date +%Y%m%d)
          BUILD_NO="${BUILD_DATE}${GITHUB_SHA:0:2}"
          NEW_VERSION="${TAG_VERSION}+${BUILD_NO}"
          sed -i "s/^version: .*/version: ${NEW_VERSION}/" pubspec.yaml
          echo "Set version: ${NEW_VERSION}"

      - name: Set package name
        shell: bash
        run: |
          PACKAGE="${{ matrix.package }}"
          # 替换 build.gradle.kts 中的 namespace 和 applicationId
          sed -i "s/^    namespace = \"com.tencent.wecarflow\"/    namespace = \"${PACKAGE}\"/" android/app/build.gradle.kts
          sed -i "s/^        applicationId = \"com.tencent.wecarflow\"/        applicationId = \"${PACKAGE}\"/" android/app/build.gradle.kts
          echo "Package: ${PACKAGE}"

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          PACKAGE="${{ matrix.package }}"
          # 将 com.xxx.yyy 转为 com-xxx-yyy
          PKG_NAME=$(echo "${PACKAGE}" | tr '.' '-')
          cp build/app/outputs/flutter-apk/app-release.apk kgka_Music_${PKG_NAME}-${{ github.ref_name }}.apk
          echo "Output: kgka_Music_${PKG_NAME}-${{ github.ref_name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-${{ matrix.package }}
          path: kgka_Music_*.apk
          retention-days: 30

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          merge-multiple: true
          path: ./apks

      - name: Create Release with all APKs
        uses: softprops/action-gh-release@v1
        with:
          files: ./apks/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
