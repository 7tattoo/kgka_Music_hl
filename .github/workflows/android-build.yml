name: Build Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 需要写权限才能创建 GitHub Release
permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # 图标等二进制资源已从 git-lfs 转为普通 Git 对象（见 .gitattributes），
          # 无需 lfs: true。若将来重新引入 LFS，务必在此打开，否则 aapt2 会因
          # 读到 LFS 指针文本而报 "file failed to compile"。
          lfs: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify image assets are real binaries (not LFS pointers)
        shell: bash
        run: |
          # 提前失败优于在 aapt2 阶段才发现：任何图片若是 LFS 指针文本，
          # 说明 checkout 配置或 .gitattributes 出了问题。
          bad=0
          while IFS= read -r f; do
            if head -c 45 "$f" | grep -q 'git-lfs.github.com/spec'; then
              echo "::error file=$f::still a git-lfs pointer, not real image data"
              bad=1
            fi
          done < <(find . -path ./.git -prune -o -type f \
                     \( -name '*.png' -o -name '*.jpg' -o -name '*.ico' \) -print)
          if [ "$bad" != "0" ]; then
            exit 1
          fi
          echo "all image assets are real binaries"

      - name: Install dependencies
        run: flutter pub get

      - name: Auto-increment version from tag
        shell: bash
        run: |
          # 从 tag (v3.0.1) 提取版本号，build 号用日期+序号保证每次递增
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ -z "$TAG_VERSION" || "$TAG_VERSION" == "$GITHUB_REF_NAME" ]]; then
            # workflow_dispatch 或非 v 前缀，用当前 pubspec 版本
            TAG_VERSION=$(grep -oP '^version: \K[^+]+' pubspec.yaml | head -1)
          fi
          BUILD_DATE=$(date +%Y%m%d)
          # 递增 build 号：日期 + 短 SHA 前2位，保证唯一递增
          BUILD_NO="${BUILD_DATE}${GITHUB_SHA:0:2}"
          NEW_VERSION="${TAG_VERSION}+${BUILD_NO}"
          sed -i "s/^version: .*/version: ${NEW_VERSION}/" pubspec.yaml
          echo "Set version: ${NEW_VERSION}"

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk kgka_Music_Android-${{ github.ref_name }}.apk

      - name: Rename App Bundle
        run: |
          cp build/app/outputs/bundle/release/app-release.aab kgka_Music_Android-${{ github.ref_name }}.aab

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            kgka_Music_Android-*.apk
            kgka_Music_Android-*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kgka_Music-Android-APK
          path: kgka_Music_Android-*.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kgka_Music-Android-AAB
          path: kgka_Music_Android-*.aab
          retention-days: 30
