name: Build Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk kgka_Music_Android-${{ github.ref_name }}.apk

      - name: Rename App Bundle
        run: |
          cp build/app/outputs/bundle/release/app-release.aab kgka_Music_Android-${{ github.ref_name }}.aab

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            kgka_Music_Android-*.apk
            kgka_Music_Android-*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kgka_Music-Android-APK
          path: kgka_Music_Android-*.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kgka_Music-Android-AAB
          path: kgka_Music_Android-*.aab
          retention-days: 30
